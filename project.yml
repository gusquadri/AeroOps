# XcodeGen spec for AeroOps. Edit this file, never the generated AeroOps.xcodeproj (git-ignored).
#   xcodegen generate
#   xcodebuild -scheme AeroOps -destination 'platform=macOS' build
#   xcodebuild -scheme AeroOps -destination 'platform=macOS' test   # runs the AeroKit package tests
#   xcodebuild -scheme AeroOpsMobile -destination 'platform=iOS Simulator,name=iPhone 18 Pro' build
name: AeroOps

options:
  bundleIdPrefix: app.aeroops
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"            # Swift 6 language mode (XcodeGen's preset default is 5.0)
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # What development builds show. Releases take the version from the vX.Y.Z tag and the build
    # number from the commit count (Scripts/release.sh).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # Scripts/release.sh overrides this with Developer ID.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: VUDQQS32NW
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  AeroKit:
    path: Packages/AeroKit
  # MCP Swift SDK for aeroops-mcp, pinned exactly.
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: 0.12.1
  # Already in the SDK's graph; declared because `Transport.logger` is a swift-log Logger.
  swift-log:
    url: https://github.com/apple/swift-log
    from: 1.5.0
  # Sparkle 2 updates, pinned exactly.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  AeroOps:
    type: application
    platform: macOS
    sources:
      - path: App
      # Views and models the iOS app uses too (no AppModel, no AppKit).
      - path: Shared
    entitlements:
      path: App/AeroOps.entitlements
      properties:
        # No App Sandbox: the app spawns /usr/bin/ssh, owns PTYs and listens on Unix sockets.
        com.apple.security.app-sandbox: false
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.aeroops
    settings:
      base:
        PRODUCT_NAME: AeroOps
        PRODUCT_BUNDLE_IDENTIFIER: app.aeroops.AeroOps
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: $(AEROOPS_PROVISIONING_PROFILE)
        AEROOPS_PROVISIONING_PROFILE: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AeroOps
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_APP_SANDBOX: NO
        ENABLE_PREVIEWS: YES
        # Sparkle keys (SUFeedURL, SUPublicEDKey) come from App/Info.plist, merged into the
        # generated one. Both are empty here, so the updater never starts in dev builds;
        # Scripts/release.sh sets them.
        INFOPLIST_FILE: App/Info.plist
        AEROOPS_FEED_URL: ""
        AEROOPS_SPARKLE_PUBLIC_KEY: ""
    dependencies:
      - package: AeroKit
        product: AeroCore
      - package: AeroKit
        product: SSHKit
      - package: AeroKit
        product: KeyAgent
      - package: AeroKit
        product: AskpassProtocol
      - package: AeroKit
        product: Collectors
      - package: AeroKit
        product: TerminalKit
      - package: AeroKit
        product: AgentBridge
      # Wire types the app shows (JSONValue arguments, tool names, socket path limits).
      - package: AeroKit
        product: BridgeProtocol
      - package: AeroKit
        product: AeroTheme
      - package: AeroKit
        product: TermiusImport
      - package: Sparkle
      # Build the MCP CLI first and copy it to AeroOps.app/Contents/MacOS/aeroops-mcp.
      - target: aeroops-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
      # The SSH_ASKPASS helper for password hosts, at AeroOps.app/Contents/MacOS/aeroops-askpass.
      - target: aeroops-askpass
        embed: true
        codeSign: true
        copy:
          destination: executables

  # The iOS app: dashboard, hosts, keys, a terminal and a file browser per host. iOS cannot run
  # /usr/bin/ssh, so it connects with AeroKit's in-process EmbeddedSSH client (EmbeddedTerminal
  # puts libghostty on top for the terminal); everything else (hosts, host keys, keys, passwords,
  # collectors, SFTP, theme) is the same AeroKit code the Mac app uses, plus Shared/.
  AeroOpsMobile:
    type: application
    platform: iOS
    sources:
      - path: Mobile
      - path: Shared
    entitlements:
      path: Mobile/AeroOpsMobile.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.aeroops
    settings:
      base:
        PRODUCT_NAME: AeroOps
        PRODUCT_BUNDLE_IDENTIFIER: app.aeroops.AeroOpsMobile
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        # One 1024 px icon in Mobile/Assets.xcassets; iOS applies the corner mask.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # No ITSAppUsesNonExemptEncryption yet: SSH is standard encryption outside Apple's OS, and
        # the value follows from the export compliance answers in App Store Connect.
        INFOPLIST_KEY_CFBundleDisplayName: AeroOps
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSFaceIDUsageDescription: AeroOps uses Face ID to unlock the app when you open it, and before it signs in to a server with one of your SSH keys.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: AeroOps connects over SSH to the servers you add, including ones on your local network.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: NO
        # Simulator builds sign locally; device builds need a provisioning profile, which comes
        # with the paid developer account (and iCloud Keychain sync with it).
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    dependencies:
      - package: AeroKit
        product: AeroCore
      - package: AeroKit
        product: SSHKit
      - package: AeroKit
        product: KeyAgent
      - package: AeroKit
        product: AskpassProtocol
      - package: AeroKit
        product: Collectors
      - package: AeroKit
        product: EmbeddedSSH
      - package: AeroKit
        product: EmbeddedTerminal
      - package: AeroKit
        product: AeroTheme

  aeroops-mcp:
    type: tool
    platform: macOS
    sources:
      - path: MCP
    # Stdio MCP server that forwards tool calls to the app over ~/.aeroops/bridge.sock. The app
    # only accepts it when it carries the app's team ID and this bundle identifier
    # (AgentBridge's CodeSignaturePeerValidator), so it is signed like the app.
    dependencies:
      - package: MCP
        product: MCP
      - package: swift-log
        product: Logging
      - package: AeroKit
        product: BridgeProtocol
    settings:
      base:
        PRODUCT_NAME: aeroops-mcp
        PRODUCT_BUNDLE_IDENTIFIER: app.aeroops.mcp
        # Embed an Info.plist in the Mach-O so the binary carries a stable identifier.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        # No entitlements: otherwise Xcode adds com.apple.application-identifier, a restricted
        # entitlement a bare tool cannot back with a provisioning profile under Developer ID.
        ENTITLEMENTS_REQUIRED: NO

  aeroops-askpass:
    type: tool
    platform: macOS
    sources:
      - path: Askpass
    # SSH_ASKPASS helper: ssh runs it for password hosts and it asks the app for the password over
    # ~/.aeroops/askpass.sock. The app only answers it when
    # it carries the app's team ID and this bundle identifier, so it is signed like the app.
    dependencies:
      - package: AeroKit
        product: AskpassProtocol
    settings:
      base:
        PRODUCT_NAME: aeroops-askpass
        PRODUCT_BUNDLE_IDENTIFIER: app.aeroops.askpass
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        # No entitlements, for the same reason as aeroops-mcp.
        ENTITLEMENTS_REQUIRED: NO

schemes:
  AeroOps:
    build:
      targets:
        AeroOps: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: AeroKit/AeroCoreTests
        - package: AeroKit/SSHKitTests
        - package: AeroKit/KeyAgentTests
        - package: AeroKit/CollectorsTests
        - package: AeroKit/EmbeddedSSHTests
        - package: AeroKit/TerminalKitTests
        - package: AeroKit/BridgeProtocolTests
        - package: AeroKit/AskpassProtocolTests
        - package: AeroKit/AgentBridgeTests
        - package: AeroKit/AeroThemeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AeroOpsMobile:
    build:
      targets:
        AeroOpsMobile: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
